name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Core tests + UI check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: ui

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS
            os: macos-latest
            # One .dmg that runs on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Build desktop installer
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXTRA_ARGS=()
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA_ARGS+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx tauri build ${{ matrix.args }} "${EXTRA_ARGS[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: Groovie-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
