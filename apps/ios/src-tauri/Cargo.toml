[package]
name = "groovie-ios"
description = "Groovie iOS app"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rudyorre/groovie"

[lib]
name = "groovie_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "groovie-ios"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
groovie-core = { path = "../../../crates/groovie-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }

[profile.release]
strip = true
lto = true
