[package]
name = "groovie-desktop"
description = "Groovie desktop app"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rudyorre/groovie"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
groovie-core = { path = "../../../crates/groovie-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
strip = true
lto = true
