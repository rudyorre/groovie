[workspace]
resolver = "2"
members = ["crates/groovie-core", "crates/groovie-sim", "crates/grooviectl"]
# The Tauri shell has heavy native deps (webkit on Linux), so it lives in its
# own workspace and is built separately (`pnpm tauri build` / CI).
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rudyorre/groovie"
authors = ["Groovie contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"

[profile.release]
strip = true
lto = true

